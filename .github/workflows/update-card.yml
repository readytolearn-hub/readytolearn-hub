name: Update Profile Card

on:
  schedule:
    - cron: "0 0 * * *"       # daily: keeps the Uptime line current
  workflow_dispatch:           # run manually from the Actions tab
  push:
    branches: [main]
    paths: ["build_card.py", "me.jpg"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Build card
        run: python build_card.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || (git commit -m "chore: refresh profile card" && git push)
